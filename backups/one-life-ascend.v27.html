<title>One Life: Ascend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one full-window stage, the pixel canvas scaled to fit; HUD and menus are DOM layers over it. */
/* A deliberate single dark look: night at the foot of the tower. */
:root{
  --bg:#0d0b14; --panel:#181424; --panel2:#221c33; --line:#3a3150;
  --ink:#efe6d2; --dim:#a39ab4; --gold:#f2c14e; --red:#e5484d; --stam:#5fd0a8; --sky:#7fb8ff;
  --r0:#8f8a99; --r1:#e8e4da; --r2:#4ea1ff; --r3:#b46cff; --r4:#f2c14e;
  --font-d:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --font-l:'Silkscreen', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-d);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;touch-action:none}
#app{position:relative;height:100%;display:grid;place-items:center}
#stage{position:relative;--s:2;--u:calc(var(--s) * 1px);box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
button{font-family:var(--font-d);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-size:max(10px, calc(var(--u) * 7))}
.hud-tl{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*6);display:grid;gap:calc(var(--u)*3);width:calc(var(--u)*110)}
.bar{position:relative;height:calc(var(--u)*8);background:#0008;border:max(1px,calc(var(--u)*1)) solid #000;box-shadow:0 0 0 max(1px,calc(var(--u)*1)) #ffffff22}
.bar i{position:absolute;inset:0;transform-origin:left;display:block}
.bar.hp i{background:linear-gradient(#ff6b6f,var(--red) 60%,#a32e33)}
.bar.st{height:calc(var(--u)*4)}
.bar.st i{background:var(--stam)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-l);font-size:max(9px,calc(var(--u)*6));line-height:1;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.lv{font-family:var(--font-l);font-size:max(9px,calc(var(--u)*6));text-shadow:0 1px 0 #000;color:var(--ink);white-space:nowrap}
.lv b{color:var(--gold);font-weight:400}
.hud-tc{position:absolute;left:50%;top:calc(var(--u)*6);transform:translateX(-50%);text-align:center;font-family:var(--font-l);font-size:max(9px,calc(var(--u)*6));text-shadow:0 1px 0 #000;white-space:nowrap}
.hud-tc .w2{color:#ffa040}.hud-tc .w3{color:#ff3b3b}
.hud-tr{position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*6);display:grid;justify-items:end;gap:calc(var(--u)*3)}
#mini{width:calc(var(--u)*72);height:calc(var(--u)*48);image-rendering:pixelated;border:max(1px,calc(var(--u)*1)) solid #000;box-shadow:0 0 0 max(1px,calc(var(--u)*1)) #ffffff22;background:#000a}
.purse{display:flex;gap:calc(var(--u)*6);font-family:var(--font-l);font-size:max(9px,calc(var(--u)*6));text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--gold);box-shadow:inset -.12em -.12em 0 #b88a22;vertical-align:-.05em;margin-right:.25em}
.pot{display:inline-block;width:.6em;height:.8em;border-radius:.2em .2em .3em .3em;background:var(--red);box-shadow:inset 0 .2em 0 #cfe8f0;vertical-align:-.05em;margin-right:.25em}
#hints{position:absolute;left:50%;bottom:calc(var(--u)*5);transform:translateX(-50%);display:flex;gap:calc(var(--u)*7);font-family:var(--font-l);font-size:max(9px,calc(var(--u)*5.5));white-space:nowrap;background:#000a;border:1px solid #ffffff18;padding:calc(var(--u)*2.5) calc(var(--u)*6);color:var(--dim)}
#hints kbd{font-family:inherit;color:var(--ink);background:#ffffff18;border:1px solid #ffffff30;border-bottom-width:2px;padding:0 .35em;margin-right:.35em}
#hints .urge{color:var(--gold);animation:urge .8s infinite alternate}
#hints .urge kbd{color:#1a1206;background:var(--gold);border-color:#b88a22}
@keyframes urge{from{opacity:1}to{opacity:.55}}
.ladder{display:flex;flex-wrap:wrap;gap:.35em;margin:.45em 0 .1em;font-family:var(--font-l);font-size:.62em}
.ladder span{opacity:.35;border:1px solid transparent;padding:.1em .3em}
.ladder span.on{opacity:1;border-color:currentColor}
#bossBar{position:absolute;left:50%;bottom:calc(var(--u)*24);transform:translateX(-50%);width:calc(var(--u)*240);text-align:center}
#bossName{font-family:var(--font-l);font-size:max(9px,calc(var(--u)*6));margin-bottom:calc(var(--u)*2);text-shadow:0 1px 0 #000;color:#ffd6d7}
.bar.boss{height:calc(var(--u)*6)}
.bar.boss i{background:linear-gradient(#ff8a5a,#d0362e)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:700;font-size:max(18px,calc(var(--u)*16));letter-spacing:.04em;text-shadow:0 2px 0 #000,0 0 20px #000;opacity:0;transition:opacity .35s;text-wrap:balance;padding-inline:8%}
#banner small{display:block;font-family:var(--font-l);font-weight:400;font-size:max(10px,calc(var(--u)*6));letter-spacing:.12em;color:var(--dim);margin-top:.4em}
#banner.on{opacity:1}
/* LEVEL UP title: pops in gold, holds, then floats away */
#lvlup{position:absolute;left:0;right:0;top:16%;text-align:center;opacity:0;pointer-events:none}
#lvlup.on{animation:lvlpop 2.3s ease-out forwards}
#lvlup b{display:block;font-weight:700;font-size:max(30px,calc(var(--u)*28));letter-spacing:.08em;line-height:1;background:linear-gradient(#fffbe0 15%,#ffd65a 50%,#c07a18 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2c06) drop-shadow(0 0 10px #f2c14e99)}
#lvlup span{display:inline-block;margin-top:.45em;font-family:var(--font-l);font-size:max(11px,calc(var(--u)*8));color:var(--ink);background:#0d0b14cc;border:1px solid #f2c14e99;padding:.2em .7em}
#lvlup small{display:block;margin-top:.45em;font-family:var(--font-l);font-size:max(10px,calc(var(--u)*6));color:#ffe08a;text-shadow:0 1px 0 #000}
@keyframes lvlpop{0%{opacity:0;transform:scale(.3)}10%{opacity:1;transform:scale(1.2)}18%{transform:scale(1)}78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){#lvlup.on{animation:lvlfade 2.3s forwards}@keyframes lvlfade{0%,80%{opacity:1}100%{opacity:0}}}
#prompt{position:absolute;left:50%;bottom:calc(var(--u)*44);transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:calc(var(--u)*3) calc(var(--u)*6);font-family:var(--font-l);font-size:max(9px,calc(var(--u)*6));white-space:nowrap}
#prompt kbd{color:var(--gold);font-family:inherit}
#toasts{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*42);display:grid;gap:calc(var(--u)*2);font-family:var(--font-l);font-size:max(9px,calc(var(--u)*5.5))}
#toasts div{background:#000b;padding:calc(var(--u)*2) calc(var(--u)*4);border-left:2px solid currentColor;animation:tin 3s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(4px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}
#pauseBtn{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*6);pointer-events:auto;background:#000a;color:var(--ink);border:1px solid var(--line);font-family:var(--font-l);font-size:max(10px,calc(var(--u)*6));padding:calc(var(--u)*2) calc(var(--u)*5)}

/* Screens */
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,7,14,.78);overflow:auto;padding:12px;box-sizing:border-box;font-size:max(12px,calc(var(--u)*7.2))}
#screen.clear{background:linear-gradient(180deg,rgba(9,7,14,.2),rgba(9,7,14,.75))}
.panel{background:var(--panel);border:2px solid #000;box-shadow:0 0 0 2px var(--line),0 12px 40px #000;padding:1.2em 1.4em;max-width:min(92%,40em);width:100%;box-sizing:border-box;margin:auto}
.panel.wide{max-width:min(96%,52em)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.6em;letter-spacing:.02em}
.eyebrow{font-family:var(--font-l);font-size:.75em;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.muted{color:var(--dim)}
p{margin:.5em 0;line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:.6em;margin-top:1em}
.btn{background:var(--panel2);color:var(--ink);border:2px solid #000;box-shadow:0 0 0 1px var(--line),inset 0 -3px 0 #0006;padding:.55em 1.1em;font-size:1em;font-weight:600}
.btn:hover{background:#2c2442}
.btn.go{background:var(--gold);color:#1a1206;box-shadow:0 0 0 1px #000,inset 0 -3px 0 #b88a22}
.btn.go:hover{background:#ffd56e}
.btn.warn{color:#ffb3b5}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Title */
.title{text-align:center;display:grid;gap:.8em;justify-items:center}
.logo{line-height:.85;font-weight:700;letter-spacing:.02em;text-shadow:0 .08em 0 #000,0 0 .6em #000}
.logo .a{display:block;font-size:2.2em;color:var(--dim);letter-spacing:.3em;font-weight:600}
.logo .b{display:block;font-size:5em;color:var(--gold);text-shadow:0 .06em 0 #8a5a12,0 .12em 0 #000,0 0 .5em #0008}
.tag{font-family:var(--font-l);letter-spacing:.14em;font-size:.8em;color:var(--ink);text-shadow:0 1px 0 #000}
.saveinfo{font-family:var(--font-l);font-size:.72em;color:var(--dim);margin-top:.2em}

/* Class select */
.classes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7em;margin-top:1em}
@media (max-width:640px){.classes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cls{background:var(--panel2);border:2px solid #000;box-shadow:0 0 0 1px var(--line);color:var(--ink);text-align:left;padding:.7em;display:grid;gap:.35em;align-content:start;font-size:.9em}
.cls:hover,.cls:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.cls img{width:3.4em;height:auto;image-rendering:pixelated;justify-self:center}
/* Character creator */
.cr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:1em;margin-top:.6em}
@media (max-width:600px){.cr{grid-template-columns:1fr}}
.cr-prev{background:radial-gradient(ellipse at 50% 70%,#3a3352,#15111f);border:1px solid var(--line);display:flex;justify-content:center;align-items:flex-end;gap:.8em;padding:1em .6em .8em;min-height:8em}
.cr-prev img{image-rendering:pixelated;width:4.4em;height:auto;filter:drop-shadow(0 3px 0 #0007)}
.cr-prev img.big{width:6.4em}
.cr-info{margin-top:.6em;font-size:.88em;line-height:1.45}
.cr-opts .sec{margin:.55em 0 .3em}
.seg{display:flex;flex-wrap:wrap;gap:.35em}
.seg .btn{padding:.38em .7em;font-size:.9em}
.seg .btn.on{background:var(--gold);color:#1a1206;box-shadow:0 0 0 1px #000,inset 0 -3px 0 #b88a22}
.stepper{display:flex;align-items:center;gap:.5em}
.stepper .btn{padding:.3em .65em}
.stepper b{min-width:6.5em;text-align:center}
.sw{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.4em}
.sw button{width:1.75em;height:1.75em;border-radius:50%;border:2px solid #000;box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--gold),0 0 8px var(--gold)}
@media (max-height:520px){.cr-prev{min-height:0;padding:.5em}.cr-prev img{width:3.2em}.cr-prev img.big{width:4.6em}.cr-opts .sec{margin:.35em 0 .2em}.sw button{width:1.55em;height:1.55em}}
.cls b{font-size:1.15em}
.cls .k{font-family:var(--font-l);font-size:.7em;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.stat{display:flex;justify-content:space-between;font-family:var(--font-l);font-size:.72em;color:var(--dim)}
.stat em{font-style:normal;color:var(--ink)}

/* Story */
.story{max-width:30em;text-align:center}
.story p{font-size:1.15em;line-height:1.55}
.story .voice{color:var(--gold);font-style:italic}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7em;margin-top:1em}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel2);border:2px solid #000;box-shadow:0 0 0 2px var(--rc,var(--line));color:var(--ink);text-align:left;padding:.8em;display:grid;gap:.3em;align-content:start}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 2px var(--rc),0 0 18px var(--rc)}
.card .k{font-family:var(--font-l);font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.card b{font-size:1.2em}
.card .lvl{font-family:var(--font-l);font-size:.72em;color:var(--dim)}
.card .num{font-family:var(--font-l);font-size:.68em;color:var(--dim);justify-self:end}

/* Bag / shop */
.bagwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1em;margin-top:.8em}
@media (max-width:620px){.bagwrap{grid-template-columns:1fr}}
.sec{font-family:var(--font-l);font-size:.72em;letter-spacing:.12em;color:var(--dim);margin:.7em 0 .35em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4em}
.slot{aspect-ratio:1;max-width:100%;background:#0006;border:2px solid #000;box-shadow:0 0 0 1px var(--rc,var(--line));display:grid;place-items:center;position:relative;padding:0;color:var(--dim)}
.slot img{width:70%;image-rendering:pixelated}
.slot .lab{position:absolute;bottom:.15em;left:0;right:0;text-align:center;font-family:var(--font-l);font-size:.55em;color:var(--dim)}
.slot .pr{position:absolute;top:.15em;right:.25em;font-family:var(--font-l);font-size:.6em;color:var(--gold)}
.slot.sel{box-shadow:0 0 0 2px var(--rc,var(--ink)),0 0 12px var(--rc,var(--ink))}
.slot.empty{color:#ffffff30}
.detail{background:#0005;border:1px solid var(--line);padding:.8em;min-height:9em}
.detail h3{font-size:1.15em}
.detail ul{margin:.4em 0;padding-left:1.1em;line-height:1.5}
.detail .neg{color:#ff9a9d}
.detail .leg{color:var(--gold)}
.detail .row{margin-top:.6em}
.detail .btn{padding:.4em .8em;font-size:.9em}

/* Summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6em;margin:1em 0}
@media (max-width:520px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{background:#0005;border:1px solid var(--line);padding:.6em}
.sum b{display:block;font-size:1.5em;font-variant-numeric:tabular-nums}
.sum span{font-family:var(--font-l);font-size:.62em;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.build{display:flex;flex-wrap:wrap;gap:.35em}
.chip{font-family:var(--font-l);font-size:.68em;background:var(--panel2);border:1px solid var(--line);padding:.25em .5em}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;margin:.8em 0;align-items:baseline}
.keys kbd{font-family:var(--font-l);font-size:.75em;background:var(--panel2);border:1px solid var(--line);padding:.15em .45em;color:var(--gold);white-space:nowrap}

/* Touch controls: a floating joystick for the left thumb, an arc of icon buttons around ROLL for the right */
#touch{position:absolute;inset:0;pointer-events:none;--b:clamp(46px,11.5vmin,62px)}
#joyZone{position:absolute;left:0;top:0;bottom:0;width:48%;pointer-events:auto;touch-action:none}
#joyGhost{position:absolute;left:calc(env(safe-area-inset-left,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:108px;height:108px;border-radius:50%;border:2px dashed #ffffff24;display:grid;place-items:center;transition:opacity .2s}
#joyGhost::after{content:"";width:40px;height:40px;border-radius:50%;background:#ffffff16}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #ffffff3a;background:radial-gradient(#ffffff12,#ffffff04 70%);display:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffffb0,#ffffff55);box-shadow:0 2px 8px #0008}
.tpad{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(var(--b)*4);height:calc(var(--b)*2.9);pointer-events:none}
.tb{position:absolute;width:var(--b);height:var(--b);border-radius:50%;border:2px solid #ffffff4a;background:#0d0b14b8;color:var(--ink);display:grid;place-items:center;pointer-events:auto;touch-action:none;padding:0;box-shadow:0 3px 10px #0009;transition:transform .06s,background .15s}
.tb svg{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tb.press{transform:scale(.88)}
.tb[hidden],.tb [hidden]{display:none}
.tb.roll{right:0;bottom:0;width:calc(var(--b)*1.45);height:calc(var(--b)*1.45);border-color:#ffffff30}
.tb.roll::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--stam) calc(var(--st,1)*1turn),#ffffff1e 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.tb.roll.cd{opacity:.55}
.tb.run{right:calc(var(--b)*1.7);bottom:0}
.tb.run.on{background:#5fd0a860;border-color:var(--stam);color:#fff}
.tb.pot{right:calc(var(--b)*1.4);bottom:calc(var(--b)*1.3)}
.tb.pot.urge{border-color:var(--gold);animation:urge .7s infinite alternate}
.tb.pot.empty{opacity:.4}
.tb.bag{right:calc(var(--b)*.1);bottom:calc(var(--b)*1.75)}
.tb.act{right:calc(var(--b)*2.75);bottom:calc(var(--b)*1.05);width:calc(var(--b)*1.15);height:calc(var(--b)*1.15);background:#f2c14ed8;color:#1a1206;border-color:#fff3b0;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px #f2c14e40,0 3px 10px #0009}}
.tb .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--red);color:#fff;font:10px/18px var(--font-l);text-align:center}
.tb .dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
body.touch #hints{display:none}
body.touch #pauseBtn{bottom:auto;top:calc(var(--u)*76);min-width:42px;min-height:38px}
body.touch .btn{min-height:42px}
/* short landscape phones: compact menus that still fit without scrolling where possible */
@media (max-height:520px){
  #screen{font-size:12px;padding:6px}
  .panel{padding:.8em 1em}
  h2{font-size:1.3em}
  .logo .a{font-size:1.5em} .logo .b{font-size:3.4em}
  .title{gap:.45em}
  .cls{padding:.5em;font-size:.85em} .cls img{width:2.4em}
  .bagwrap{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:.7em;margin-top:.4em}
  .slots{grid-template-columns:repeat(8,minmax(0,1fr));gap:.3em}
  .sec{margin:.4em 0 .25em}
  .detail{min-height:0;padding:.6em}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))} .card{padding:.6em}
  .row{margin-top:.6em} .btn{padding:.45em .9em}
  .sum{grid-template-columns:repeat(4,minmax(0,1fr));margin:.5em 0}
  .keys{margin:.4em 0}
  .story p{font-size:1.05em}
}
@media (prefers-reduced-motion:reduce){#toasts div{animation:none}#banner{transition:none}.card:hover{transform:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" width="480" height="270" aria-label="Game view"></canvas>
    <div id="hud" hidden>
      <div class="hud-tl">
        <div class="bar hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
       <div class="lv" id="lvTxt"></div>
      </div>
      <div class="hud-tc" id="waveTxt"></div>
      <div class="hud-tr">
        <canvas id="mini" width="48" height="32"></canvas>

'use strict';
// ============================================================ basics
// W x H is the game's pixel grid: 480x270 on desktop; on touch devices fit() reshapes it to the screen
let W = 480, H = 270;
const TS = 16, SAVE_KEY = 'ola_save_v1', PREF_KEY = 'ola_prefs';
// Test build: one floor, one class, one fixed loot set, one boss. Set to null to play the full climb.
const TEST = { floor: 1 };
const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const R = Math.random, rand = (a, b) => a + R() * (b - a), ri = (a, b) => Math.floor(a + R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)], clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
function wpick(w) { let s = 0; for (const x of w) s += x; let r = R() * s; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) return i; } return w.length - 1; }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return Math.abs(d); }
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

// ============================================================ pixel sprites
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function spr(rows, pal) {
  const h = rows.length, w = rows[0].length, c = mk(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const k = rows[j][i]; if (pal[k]) { x.fillStyle = pal[k]; x.fillRect(i, j, 1, 1); } }
  return c;
}
function flip(c) { const f = mk(c.width, c.height), x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f; }
function sil(c, col) { const f = mk(c.width, c.height), x = f.getContext('2d'); x.drawImage(c, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return f; }
function up(c, s) { const f = mk(c.width * s, c.height * s), x = f.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, f.width, f.height); return f; }

        <div class="sec">Hair</div>${step(HAIRS[L.hair].n, 'crHair')}${sw(HAIRC, L.hc, 'crHc')}
        <div class="sec">Face</div>${step(FACES[L.face].n, 'crFace')}<div class="sec">Eyes</div>${sw(EYEC, L.ec, 'crEc')}
        <div class="sec">Skin</div>${sw(SKINS, L.skin, 'crSkin')}
      </div>
    </div>
    <div class="row"><button class="btn go" data-a="crBegin">Begin as ${C.name}</button><button class="btn" data-a="crRand">Randomize</button><button class="btn" data-a="title">Back</button></div></div>`);
}
const cyc = (list, cur, d) => list[(list.indexOf(cur) + d + list.length) % list.length];
A.crCls = d => { cr.cls = d.c; renderCreate(); };
A.crSex = d => { const L = cr.look; L.sex = d.s; if (!HAIR_BY_SEX[d.s].includes(L.hair)) L.hair = defaultLook(d.s).hair; renderCreate(); };
A.crHair = d => { cr.look.hair = cyc(HAIR_BY_SEX[cr.look.sex], cr.look.hair, +d.d); renderCreate(); };
A.crFace = d => { cr.look.face = cyc(FACE_KEYS, cr.look.face, +d.d); renderCreate(); };
A.crHc = d => { cr.look.hc = +d.i; renderCreate(); };
A.crEc = d => { cr.look.ec = +d.i; renderCreate(); };
A.crSkin = d => { cr.look.skin = +d.i; renderCreate(); };
A.crRand = () => { const sex = R() < .5 ? 'm' : 'f'; cr.look = { sex, hair: pick(HAIR_BY_SEX[sex]), hc: ri(0, HAIRC.length - 1), face: pick(FACE_KEYS), skin: ri(0, SKINS.length - 1), ec: ri(0, EYEC.length - 1) }; renderCreate(); };
A.crBegin = () => { prefs.look = cr.look; prefs.lastCls = cr.cls; lsSet(PREF_KEY, prefs); A.pickClass({ c: cr.cls, look: cr.look }); };
A.pickClass = d => {
  newRun(d.c); G.look = Object.assign({}, d.look || defaultLook('m')); G.mode = 'menu'; lsDel(SAVE_KEY);
  const go = () => startFloor(1);
  if (prefs.seenStory) { demoToRun(); go(); return; }
  prefs.seenStory = true; lsSet(PREF_KEY, prefs);
  demoToRun();
  story([
    { t: 'A bus horn. A child in the road. You pushed.' },
    { t: 'Then nothing. You wake at the foot of a tower that has no top.' },
    { t: '“This is a test. Clear all one hundred floors and your old life is returned to you.”', v: true },
    { t: '“Fall, and you begin again at the bottom. With nothing.”', v: true },
  ], go);
};
function demoToRun() { G.demo = false; }
let storyQ = null;
function story(lines, done) { storyQ = { lines, i: 0, done }; G.mode = 'story'; showHUD(false); renderStory(); }
function renderStory() { const s = storyQ, l = s.lines[s.i]; showScreen(`<div class="story"><p class="${l.v ? 'voice' : ''}">${l.t}</p><div class="row" style="justify-content:center"><button class="btn go" data-a="storyNext">${s.i === s.lines.length - 1 ? 'Begin' : 'Continue'}</button><button class="btn" data-a="storySkip">Skip</button></div></div>`); }
function storyNext() { storyQ.i++; if (storyQ.i >= storyQ.lines.length) { const d = storyQ.done; storyQ = null; d(); } else renderStory(); }
A.storyNext = storyNext; A.storySkip = () => { const d = storyQ.done; storyQ = null; d(); };

function pauseGame() { if (G.mode !== 'play') return; G.mode = 'pause'; A.pauseMenu(); }
A.pauseMenu = () => {
  G.mode = 'pause';
  const s = TEST ? null : lsGet(SAVE_KEY);
  showScreen(`<div class="panel" style="max-width:26em"><div class="eyebrow">Paused · Floor ${G.floor}</div><h2>Catch your breath</h2>
  <div class="row"><button class="btn go" data-a="resume">Resume</button><button class="btn" data-a="bagFromPause">Bag</button><button class="btn" data-a="how" data-back="pause">Controls</button><button class="btn" data-a="mute">${prefs.mute ? 'Sound on' : 'Sound off'}</button></div>
  <div class="row"><button class="btn warn" data-a="quit">Quit to title</button></div>
  <p class="muted">${s ? `Quitting returns you to the start of Floor ${s.floor}. Loot and coins from this floor are lost.` : 'No save yet: your first save happens after the Floor 1 boss. Quitting now ends this run.'}</p></div>`);
};
function resume() { G.mode = 'play'; hideScreen(); showHUD(true); }
A.resume = resume;
A.mute = () => { prefs.mute = !prefs.mute; lsSet(PREF_KEY, prefs); A.pauseMenu(); };
A.quit = () => { demoState(); scrTitle(); };
A.bagFromPause = () => openBag(false, true);

// ---------------- bag & shop
let sel = null, bagCtx = { shop: false, fromPause: false };
function openBag(shop, fromPause) { if (G.mode !== 'play' && G.mode !== 'pause') return; bagCtx = { shop, fromPause }; sel = null; G.newItems = 0; G.mode = 'bag'; renderBag(); }
function closeBag() { if (bagCtx.fromPause) A.pauseMenu(); else resume(); }
A.closeBag = closeBag;
const potionPrice = () => 25 + G.floor * 3;
const buyPrice = it => it.value * 3;
function slotBtn(it, src, i, label, price) {
  const isSel = sel && sel.src === src && sel.i == i;
  if (!it) return `<button class="slot empty${isSel ? ' sel' : ''}" data-a="sel" data-src="${src}" data-i="${i}" aria-label="Empty ${label || 'slot'}">${label ? `<span class="lab">${label}</span>` : ''}</button>`;
  return `<button class="slot${isSel ? ' sel' : ''}" style="--rc:${RARITY[it.r].c}" data-a="sel" data-src="${src}" data-i="${i}" aria-label="${it.name}"><img alt="" src="${iconURL(it.icon, it.r)}">${label ? `<span class="lab">${label}</span>` : ''}${price ? `<span class="pr">${price}</span>` : ''}</button>`;
}
function itemOf(s) { if (!s) return null; if (s.src === 'bag') return G.bag[s.i]; if (s.src === 'eq') return G.gear[s.i]; if (s.src === 'stock') return G.merchant.stock[s.i]; return null; }
function itemDetail(it) {
  const lines = Object.entries(it.st).map(([k, v]) => `<li class="${v < 0 ? 'neg' : ''}">${STAT_TXT[k](v)}</li>`).join('');
  const ladder = it.base ? `<div class="ladder">${RARITY.map((q, i) => `<span style="color:${q.c}" class="${i === it.r ? 'on' : ''}">${q.n}</span>`).join('')}</div>` : '';
  return `<h3 style="color:${RARITY[it.r].c}">${it.name}</h3><div class="eyebrow">${RARITY[it.r].n} ${it.slot === 'acc' ? it.icon : it.slot} · from floor ${it.f}</div>${ladder}<ul>${lines}${it.leg ? `<li class="leg">${LEGS[it.leg].n}: ${LEGS[it.leg].d}</li>` : ''}</ul><div class="muted">Sells for ${it.value} coins</div>`;
}
function renderBag() {
  const M = G.merchant, shop = bagCtx.shop, it = itemOf(sel);
  let detail = '<p class="muted">Select an item to see its stats.</p>';
  if (sel && sel.src === 'potion') detail = `<h3 style="color:#e5484d">Healing potion</h3><ul><li>Restores 40% of max HP</li><li>Drink with Q or the POT button</li></ul><div class="row"><button class="btn go" data-a="buyPot" ${G.coins < potionPrice() ? 'disabled' : ''}>Buy for ${potionPrice()}</button></div>`;
  else if (it) {
    let btns = '';
    if (sel.src === 'bag') {
      if (it.slot === 'acc') btns += `<button class="btn go" data-a="equip" data-k="acc1">Equip in ring slot 1</button><button class="btn" data-a="equip" data-k="acc2">Equip in slot 2</button>`;
      else btns += `<button class="btn go" data-a="equip" data-k="${it.slot}">Equip</button>`;
      if (shop) btns += `<button class="btn" data-a="sell">Sell for ${it.value}</button>`;
      btns += `<button class="btn warn" data-a="drop">Drop</button>`;
    } else if (sel.src === 'eq') btns += `<button class="btn" data-a="unequip" ${G.bag.length >= 8 ? 'disabled' : ''}>Unequip</button>`;
    else if (sel.src === 'stock') btns += `<button class="btn go" data-a="buy" ${G.coins < buyPrice(it) || G.bag.length >= 8 ? 'disabled' : ''}>Buy for ${buyPrice(it)}</button>`;
    detail = itemDetail(it) + `<div class="row">${btns}</div>`;
  }
  const eq = [['weapon', 'Weapon'], ['armor', 'Armor'], ['acc1', 'Ring 1'], ['acc2', 'Ring 2']].map(([k, l]) => slotBtn(G.gear[k], 'eq', k, l)).join('');
  const bag = Array.from({ length: 8 }, (_, i) => slotBtn(G.bag[i], 'bag', i)).join('');
  const stock = shop ? `<div class="sec">For sale · priced at 3x sell value</div><div class="slots">${M.stock.map((s, i) => slotBtn(s, 'stock', i, '', buyPrice(s))).join('')}${M.potion ? `<button class="slot${sel && sel.src === 'potion' ? ' sel' : ''}" style="--rc:#e5484d" data-a="sel" data-src="potion" data-i="0" aria-label="Healing potion"><img alt="" src="${iconURL('potion', 1)}"><span class="pr">${potionPrice()}</span></button>` : ''}</div>` : '';
  const p = G.p;
  showScreen(`<div class="panel wide"><div class="eyebrow">${shop ? 'Hidden merchant · Floor ' + G.floor : 'Inventory'}</div><h2>${shop ? '“Coins for steel, traveller.”' : 'Bag & equipment'}</h2>
    <div class="bagwrap"><div>${stock}<div class="sec">Equipped</div><div class="slots">${eq}</div><div class="sec">Bag · ${G.bag.length} / 8</div><div class="slots">${bag}</div></div>
    <div><div class="sec">Details</div><div class="detail">${detail}</div>
    <div class="sec">You</div><div class="detail" style="min-height:0"><span class="coin"></span>${G.coins} coins · <span class="pot"></span>${G.potions} potions<br>HP ${Math.ceil(p.hp)}/${p.maxHp} · Damage x${p.dmgM.toFixed(2)} · Attack speed x${p.atkSpd.toFixed(2)} · Crit ${Math.round(p.crit * 100)}%</div></div></div>
    <div class="row"><button class="btn go" data-a="closeBag">${bagCtx.fromPause ? 'Back' : 'Back to the floor'}</button></div></div>`);
}
A.sel = d => { sel = { src: d.src, i: d.src === 'eq' ? d.i : +d.i }; renderBag(); };
A.equip = d => { const it = G.bag[sel.i]; if (!it) return; const old = G.gear[d.k]; G.gear[d.k] = it; G.bag.splice(sel.i, 1); if (old) G.bag.push(old); recalc(); sel = { src: 'eq', i: d.k }; SFX.buy(); renderBag(); };
A.unequip = () => { if (G.bag.length >= 8) return; G.bag.push(G.gear[sel.i]); G.gear[sel.i] = null; recalc(); sel = null; renderBag(); };
A.sell = () => { const it = G.bag[sel.i]; if (!it) return; G.coins += it.value; G.bag.splice(sel.i, 1); sel = null; SFX.coin(); renderBag(); };
A.drop = () => { const it = G.bag[sel.i]; if (!it) return; G.bag.splice(sel.i, 1); dropItem(G.p.x + 14 * G.p.face, G.p.y, it, 2); sel = null; renderBag(); };
A.buy = () => { const M = G.merchant, it = M.stock[sel.i]; if (!it || G.coins < buyPrice(it) || G.bag.length >= 8) return; G.coins -= buyPrice(it); G.bag.push(it); noteBest(it); M.stock.splice(sel.i, 1); sel = { src: 'bag', i: G.bag.length - 1 }; SFX.buy(); renderBag(); };
A.buyPot = () => { if (G.coins < potionPrice() || !G.merchant.potion) return; G.coins -= potionPrice(); G.potions++; G.merchant.potion = false; sel = null; SFX.buy(); renderBag(); };

// ---------------- level up
let cardOffer = [];
// The boss falls -> level up on the spot: a pillar of light, rings, sparkles and the gold LEVEL UP title,
// then the power-up pick. The exit door only takes you to the next floor.
function levelUp() {
  const p = G.p, old = p.maxHp;
  G.lvl++; recalc(); p.hp += Math.max(0, p.maxHp - old);
  G.lvlFx = { t: 0 }; G.cardAt = 1.8;
  SFX.lvl(); [392, 523, 659, 784].forEach(f => tone(f, .6, 'triangle', .025, 0, .38)); buzz(70);
  for (let i = 0; i < 40; i++) { const a = rand(0, TAU), s = rand(30, 110); part(p.x, p.y - 8, pick(['#fff3b0', '#f2c14e', '#ffffff', '#ffd65a']), Math.cos(a) * s, Math.sin(a) * s - 60, rand(.6, 1.2), R() < .3 ? 2 : 1); }
  const el = $('#lvlup');
  el.innerHTML = `<b>LEVEL UP</b><span>Lv ${G.lvl - 1} → Lv ${G.lvl}</span><small>+${p.maxHp - old} max HP · +8% damage</small>`;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
function openCards() { G.mode = 'card'; showHUD(false); cardOffer = makeOffer(); renderCards(); }
function nextFloor() {
  const cleared = G.floor;
  if (TEST) { scrTestDone(); return; }
  G.floor = cleared + 1; save(); G.floor = cleared;     // save again so the loot picked up after the fight is kept
  if (cleared % 10 === 0) {
    story([{ t: '“The meadow was the easy part.”', v: true }, { t: '“You wonder why it was you. A good deed, a bad bus. Many are offered this tower. Few are watched as closely.”', v: true }, { t: '“Climb. I will be waiting at the top.”', v: true }], () => scrSlice());
  } else startFloor(cleared + 1);
}
function makeOffer() {
  const out = [];
  for (const k in EVOS) { const e = EVOS[k]; if (!G.evo[k] && e.need.every(n => G.pu[n] >= 5)) out.push({ evo: k }); }
  const avail = Object.keys(PU).filter(k => G.pu[k] < 5);
  while (out.length < 3 && avail.length) {
    const k = avail.splice(Math.floor(R() * avail.length), 1)[0], r = wpick([70, 20, 8, 2]);
    out.push({ k, r, lv: Math.min(5 - G.pu[k], r + 1) });
  }
  return out.slice(0, 3);
}
function renderCards() {
  const z = zoneOf(G.floor), canRe = G.rerollZone !== z;
  const RC = ['#e8e4da', '#4ea1ff', '#b46cff', '#f2c14e'];
  const cards = cardOffer.map((c, i) => {
    if (c.evo) return `<button class="card" style="--rc:#f2c14e" data-a="card" data-i="${i}"><span class="k">Evolution</span><b>${EVOS[c.evo].n}</b><span>${EVOS[c.evo].d}</span><span class="num">${i + 1}</span></button>`;
    const P = PU[c.k], cur = G.pu[c.k];
    return `<button class="card" style="--rc:${RC[c.r]}" data-a="card" data-i="${i}"><span class="k">${['Normal', 'Rare', 'Epic', 'Legendary'][c.r]} · ${P.t}</span><b>${P.n}</b><span class="lvl">Rank ${cur} → ${cur + c.lv} of 5</span><span>${P.d(cur + c.lv)}</span><span class="num">${i + 1}</span></button>`;
  }).join('');
  showScreen(`<div class="panel wide"><div class="eyebrow">Floor ${G.floor} cleared</div><h2>Level ${G.lvl} · choose a power-up</h2>
    <p class="muted">+10 base HP and +8% damage. Keys 1–3 pick a card.</p><div class="cards">${cards || '<p>Every power-up is maxed.</p>'}</div>
    <div class="row">${cards ? `<button class="btn" data-a="reroll" ${canRe ? '' : 'disabled'}>${canRe ? 'Reroll (R) · 1 per zone' : 'Reroll used this zone'}</button>` : `<button class="btn go" data-a="card" data-i="-1">Continue</button>`}</div></div>`);
}
function rerollCards() { const z = zoneOf(G.floor); if (G.rerollZone === z) return; G.rerollZone = z; cardOffer = makeOffer(); renderCards(); }
A.reroll = rerollCards;
function chooseCard(i) {
  if (G.mode !== 'card') return;
  const c = cardOffer[i];
  if (c) {
    const p = G.p, old = p.maxHp;
    if (c.evo) { G.evo[c.evo] = true; toast(`${EVOS[c.evo].n} awakened`, '#f2c14e'); }
    else { G.pu[c.k] += c.lv; recalc(); if (c.k === 'vit') p.hp += Math.max(0, p.maxHp - old); if (c.k === 'aegis') { p.shieldReady = true; } }
    recalc();
  } else if (i !== -1) return;
  // back to the arena: collect the loot and take the door; the run is saved at the start of the next floor
  if (!TEST) { const cleared = G.floor; G.floor = cleared + 1; save(); G.floor = cleared; }
  G.mode = 'play'; hideScreen(); showHUD(true);
  if (!TEST) toast('Saved', '#5fd0a8');
}
A.card = d => chooseCard(+d.i);
function save() { lsSet(SAVE_KEY, { cls: G.cls, look: G.look, floor: G.floor, lvl: G.lvl, coins: G.coins, potions: G.potions, gear: G.gear, bag: G.bag, pu: G.pu, evo: G.evo, kills: G.kills, time: G.time, hp: Math.ceil(G.p.hp), rr: G.rerollZone, best: G.best }); }

// ---------------- death & summaries
function die() {
  if (G.dying) return;
  lsDel(SAVE_KEY);                    // the save is wiped before the game-over screen
  G.dying = true; G.dyingT = 1.4; G.p.hp = 0; G.shake = .6; SFX.hurt(); tone(90, 1.2, 'sawtooth', .06, -50, .2);
  for (let i = 0; i < 24; i++) part(G.p.x, G.p.y - 6, pick(['#e5484d', '#ffffff', '#f0c9a0']), rand(-90, 90), rand(-120, 20), rand(.5, 1.1), 2);
  showHUD(false); $('#prompt').hidden = true;
}
const fmtTime = s => `${Math.floor(s / 3600) ? Math.floor(s / 3600) + 'h ' : ''}${Math.floor(s / 60) % 60}m ${String(Math.floor(s % 60)).padStart(2, '0')}s`;
function summaryHTML() {
  const b = G.best, build = Object.entries(G.pu).filter(([, v]) => v).map(([k, v]) => `<span class="chip">${PU[k].n} ${v}</span>`).concat(Object.keys(G.evo).filter(k => G.evo[k]).map(k => `<span class="chip" style="color:#f2c14e">${EVOS[k].n}</span>`)).join('');
  return `<div class="sum"><div><span>Floor reached</span><b>${G.floor}</b></div><div><span>Level</span><b>${G.lvl}</b></div><div><span>Time</span><b>${fmtTime(G.time)}</b></div><div><span>Kills</span><b>${G.kills}</b></div></div>
  <div class="sec">Best item</div><div>${b ? `<span style="color:${RARITY[b.r].c}">${b.name}</span> <span class="muted">· ${RARITY[b.r].n}</span>` : '<span class="muted">Nothing worth keeping</span>'}</div>
  <div class="sec">Build</div><div class="build">${build || '<span class="muted">No power-ups yet</span>'}</div>`;
}
function scrDeath() {
  G.mode = 'dead';
  showScreen(`<div class="panel wide"><div class="eyebrow" style="color:#ff9a9d">You fell on Floor ${G.floor} · the test is failed</div><h2>You wake at the bottom again</h2>${summaryHTML()}
  <div class="row"><button class="btn go" data-a="newRun">Climb again</button><button class="btn" data-a="title">Title</button></div></div>`);
}
function scrSlice() {
  G.mode = 'menu';
  showScreen(`<div class="panel wide"><div class="eyebrow" style="color:#f2c14e">Zone 1 cleared · Green Meadow</div><h2>The end of the playable slice</h2>
  <p class="muted">Floors 11 and up reuse Zone 1's monsters on retinted tiles until their art is in. Your run is saved at Floor ${G.floor + 1}.</p>${summaryHTML()}
  <div class="row"><button class="btn go" data-a="keepClimbing">Keep climbing</button><button class="btn" data-a="title">Title</button></div></div>`);
}
A.keepClimbing = () => startFloor(G.floor + 1);
function scrTestDone() {
  G.mode = 'menu'; showHUD(false);
  showScreen(`<div class="panel wide"><div class="eyebrow" style="color:#f2c14e">Test floor cleared</div><h2>Boss down. Test complete.</h2>
  <p class="muted">This build has one floor, four classes, one loot set and one boss. Nothing is saved between test runs.</p>${summaryHTML()}
  <div class="row"><button class="btn go" data-a="newRun">Run the test again</button><button class="btn" data-a="title">Title</button></div></div>`);
}

// ============================================================ layout & loop
function fit() {
  const app = $('#app'), aw = app.clientWidth, ah = app.clientHeight;
  let s;
  if (touch.on) {
    // phones and tablets: the shorter screen side gets about 270 game pixels and the grid takes the screen's
    // shape, so the game fills the display in landscape or portrait with no black bars
    s = Math.max(1, Math.min(aw, ah) / 270);
    W = clamp(Math.round(aw / s), 270, 640); H = clamp(Math.round(ah / s), 240, 560);
    s = Math.min(aw / W, ah / H);
  } else { W = 480; H = 270; s = Math.min(aw / W, ah / H); if (s >= 2) s = Math.floor(s * 2) / 2; }
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false; vign = makeVign(); }
  const st = $('#stage'); st.style.width = Math.floor(W * s) + 'px'; st.style.height = Math.floor(H * s) + 'px'; st.style.setProperty('--s', s.toFixed(3));
}
addEventListener('resize', fit); fit();
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.mode === 'play') pauseGame(); });
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G) {
    if (G.mode === 'play' || G.dying) update(dt);
    else if (G.demo) { G.t += dt; updAmb(dt); for (const m of G.mobs) updMob(m, dt); G.cam.x = G.map.w / 2 + Math.sin(G.t * .07) * 200; G.cam.y = G.map.h / 2 + Math.cos(G.t * .05) * 110; }
    render();
  }
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) document.fonts.load('8px Silkscreen');
loadArt().then(() => { demoState(); scrTitle(); requestAnimationFrame(frame); });
</script>
